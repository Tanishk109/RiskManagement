[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merchantshield-api"
version = "0.1.0"
description = "FastAPI service for MerchantShield's cost-aware fraud decision workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "pandas>=2.2,<3",
  "merchantshield-ml==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools]
packages = [
  "app",
  "app.models",
  "app.schemas",
  "app.routers",
  "app.services",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
