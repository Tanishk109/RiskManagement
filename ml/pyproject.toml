[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merchantshield-ml"
version = "0.1.0"
description = "Leakage-aware IEEE-CIS fraud modeling and merchant cost analysis"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=18,<23",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "catboost>=1.2,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
analysis = [
  "xgboost>=2.1,<4",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
]
test = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
