random_seed: 42
train_fraction: 0.70
validation_fraction: 0.15
test_fraction: 0.15
baseline_feature_sets:
  - baseline_core
  - baseline_core_time
  - baseline_core_masked
  - baseline_core_identity
  - baseline_conservative_combined
  - baseline_conservative_combined_time
baseline_solver: newton-cholesky
baseline_max_iter: 100
baseline_default_threshold: 0.50
catboost_feature_set: baseline_conservative_combined
catboost_class_weight_strategies:
  - none
  - Balanced
  - SqrtBalanced
catboost_parameters:
  loss_function: Logloss
  eval_metric: PRAUC:type=Classic
  iterations: 1000
  learning_rate: 0.05
  depth: 7
  l2_leaf_reg: 3.0
  early_stopping_rounds: 80
  thread_count: -1
  allow_writing_files: false
catboost_identity_ablation_max_ap_loss: 0.005
catboost_identity_ablation_max_roc_auc_loss: 0.005
primary_feature_sets:
  - interpretable
  - expanded
primary_parameters:
  n_estimators: 450
  max_depth: 6
  learning_rate: 0.06
  subsample: 0.85
  colsample_bytree: 0.80
  min_child_weight: 2
  reg_lambda: 2.0
  eval_metric: aucpr
  tree_method: hist
  n_jobs: -1
