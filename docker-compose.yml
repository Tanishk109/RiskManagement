services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merchantshield
      POSTGRES_USER: merchantshield
      POSTGRES_PASSWORD: merchantshield
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchantshield -d merchantshield"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - merchantshield_postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://merchantshield:merchantshield@postgres:5432/merchantshield
      MODEL_PATH: /workspace/artifacts/models/model.joblib
      MODEL_METADATA_PATH: /workspace/artifacts/models/model_metadata.json
      CATBOOST_MODEL_PATH: /workspace/artifacts/models/catboost_candidate.cbm
      CATBOOST_METADATA_PATH: /workspace/artifacts/models/catboost_candidate_metadata.json
      VALIDATION_OPERATING_CONFIG_PATH: /workspace/artifacts/models/validation_operating_config.json
      VALIDATION_DATA_PATH: /workspace/data/processed/ieee-cis/validation.parquet
      METRICS_PATH: /workspace/artifacts/metrics/final_test_metrics.json
      PREDICTIONS_PATH: /workspace/artifacts/metrics/final_test_predictions.csv
      RULES_PATH: /workspace/rules/merchant_rules.yaml
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/workspace/artifacts:ro
      - ./data/processed:/workspace/data/processed:ro
      - ./rules:/workspace/rules:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  merchantshield_postgres:
